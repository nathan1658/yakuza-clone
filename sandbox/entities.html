<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entities sandbox</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #202428; }
      #panel {
        position: fixed; left: 8px; top: 8px; padding: 8px 10px; color: #e8e8e8; background: rgba(0, 0, 0, 0.55);
        font: 12px/1.6 ui-monospace, Menlo, monospace;
      }
      #panel select, #panel input { font: inherit; }
    </style>
  </head>
  <body>
    <div id="panel">
      <label>clip <select id="clip"></select></label>
      <label><input id="play" type="checkbox" checked /> play</label>
      <label>t <input id="t" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>view <select id="view"><option>front</option><option>side</option><option>back</option><option>top</option></select></label>
      <label><input id="props" type="checkbox" /> props</label>
      <div id="info"></div>
    </div>
    <script type="module" src="/sandbox/entities/main.ts"></script>
  </body>
</html>
